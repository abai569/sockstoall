services:
  sockstoall:
    image: ghcr.io/abai569/sockstoall:${SOCKSTOALL_VERSION:-latest}
    container_name: sockstoall
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: 3456
    volumes:
      - ./data:/app/data
      - sockstoall_bin:/app/bin
    stop_grace_period: 30s
    stop_signal: SIGTERM

volumes:
  sockstoall_bin:
    name: sockstoall_bin
